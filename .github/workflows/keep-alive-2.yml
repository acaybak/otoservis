name: Keep API Alive (B)

# GitHub zamanlanmış cron'ları tek workflow'da bazen gecikiyor/atlanıyor.
# Bu bağımsız ikinci workflow, farklı dakika kalıplarıyla yedek tetikleme yapar.
on:
  schedule:
    - cron: '1-56/5 * * * *'
    - cron: '4-59/7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint (retry while cold-starting)
        run: |
          echo "Pinging OtoServis API (backup workflow)..."
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 https://otoservis-api.onrender.com/api/v1/health || echo "000")
            echo "attempt $i -> HTTP $code"
            cat /tmp/health.json 2>/dev/null || true
            echo
            if [ "$code" = "200" ]; then
              echo "API is alive"
              exit 0
            fi
            # Soğuk başlatma sürerken bekle ve tekrar dene
            sleep 30
          done
          echo "API ping failed after retries (cold start may still be in progress)"
