name: Keep API Alive

on:
  schedule:
    # Her 10 dakikada bir (Render 15 dk hareketsizlikte uyur)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          echo "Pinging OtoServis API..."
          response=$(curl -sS -w "\nHTTP_CODE:%{http_code}" --max-time 60 https://otoservis-api.onrender.com/api/v1/health || true)
          echo "$response"
          if echo "$response" | grep -q "HTTP_CODE:200"; then
            echo "API is alive"
          else
            echo "API ping completed (cold start may be in progress)"
          fi
