services:
  - type: web
    name: otoservis-api
    runtime: node
    region: frankfurt
    plan: free
    branch: master
    buildCommand: pnpm install && pnpm --filter @otoservis/database db:generate && pnpm -w build
    startCommand: node apps/api/dist/src/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: otoservis-db
          property: connectionString
      - key: JWT_SECRET
        value: otoservis-jwt-secret-2026-cloud
      - key: JWT_REFRESH_SECRET
        value: otoservis-refresh-secret-2026-cloud
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://otoservis-web-six.vercel.app,https://kupligroup.com,http://localhost:5173,http://localhost:5175

  - type: pserv
    name: otoservis-db
    plan: free
    ipAllowList: []
    databaseName: otoservis-db
    region: frankfurt
