services:
  - type: web
    name: otoservis-api
    runtime: node
    region: frankfurt
    plan: free
    branch: master
    buildCommand: npm install -g pnpm@9.15.9 prisma@6 @types/node @nestjs/cli @types/express @types/bcryptjs @types/jsonwebtoken && pnpm install --filter=!@otoservis/desktop && pnpm --filter @otoservis/database db:generate && pnpm --filter @otoservis/database build && pnpm --filter @otoservis/shared build && pnpm --filter @otoservis/types build && pnpm --filter @otoservis/validation build && pnpm --filter @otoservis/api build
    startCommand: cd packages/database && npx prisma migrate deploy && cd ../.. && node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: otoservis-db
          property: connectionString
      - key: JWT_SECRET
        value: otoservis-jwt-secret-2026-cloud
      - key: JWT_REFRESH_SECRET
        value: otoservis-refresh-secret-2026-cloud
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://otoservis-web-six.vercel.app,https://dist-theta-one-72.vercel.app,https://kupligroup.com,http://localhost:5173,http://localhost:5175
      - key: ADMIN_EMAILS
        value: acaybak@gmail.com,test2@otoservis.com

  - type: pserv
    name: otoservis-db
    plan: free
    ipAllowList: []
    databaseName: otoservis-db
    region: frankfurt
