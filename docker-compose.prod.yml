version: "3.9"

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: otoservis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: otoservis
    volumes:
      - otoservis_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otoservis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === NestJS API ===
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://otoservis:${POSTGRES_PASSWORD:-supersecretpassword}@postgres:5432/otoservis
      JWT_SECRET: ${JWT_SECRET:-production-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production-refresh-secret-change-me}
      NODE_ENV: production
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5175,http://localhost:5174}
    ports:
      - "3000:3000"

  # === Web (Landing Page) ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

  # === Nginx Reverse Proxy (Optional) ===
  # Uncomment for production with domain
  # nginx:
  #   image: nginx:alpine
  #   restart: always
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #     - web

volumes:
  otoservis_pgdata:
